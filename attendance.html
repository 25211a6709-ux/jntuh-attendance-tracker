<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JNTU Attendance Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1628;
    --card: #131c35;
    --card2: #1a2540;
    --border: #1e2d50;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --accent3: #60a5fa;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --radius: 16px;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-head); font-weight: 800; font-size: 1.25rem; color: var(--text);
    letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 36px; height: 36px; background: var(--accent);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 800; color: #fff;
  }
  .logo span { color: var(--accent3); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-user {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 6px 12px; border-radius: 10px; transition: background 0.2s;
  }
  .header-user:hover { background: var(--card); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; color: #fff;
  }
  .btn-logout {
    background: transparent; border: 1px solid var(--border);
    color: var(--text2); padding: 7px 16px; border-radius: 8px;
    font-family: var(--font-body); font-size: 0.85rem; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--accent); color: var(--accent3); }

  /* NAV TABS */
  .nav-tabs {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; padding: 0 32px; gap: 4px;
  }
  .nav-tab {
    padding: 14px 20px; font-family: var(--font-body); font-size: 0.9rem; font-weight: 500;
    color: var(--text3); border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text2); }
  .nav-tab.active { color: var(--accent3); border-bottom-color: var(--accent); }

  /* MAIN */
  main { padding: 32px; max-width: 1400px; margin: 0 auto; }

  /* PAGE TITLE */
  .page-header { margin-bottom: 28px; }
  .page-title { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
  .page-subtitle { color: var(--text2); font-size: 0.9rem; margin-top: 4px; }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .col-span-2 { grid-column: span 2; }
  .col-span-3 { grid-column: span 3; }

  /* CARD */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card-title {
    font-family: var(--font-head); font-weight: 700; font-size: 1rem;
    color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
  }
  .card-title .icon { font-size: 1.1rem; }

  /* AUTH PAGES */
  .auth-wrapper {
    min-height: calc(100vh - 64px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at 30% 40%, rgba(37,99,235,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(96,165,250,0.05) 0%, transparent 50%);
  }
  .auth-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px; width: 100%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .auth-title { font-family: var(--font-head); font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
  .auth-subtitle { color: var(--text2); font-size: 0.9rem; margin-bottom: 32px; }
  .form-row { margin-bottom: 18px; }
  .form-row label { display: block; font-size: 0.83rem; font-weight: 500; color: var(--text2); margin-bottom: 7px; letter-spacing: 0.3px; }
  .form-row input, .form-row select {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; font-family: var(--font-body); font-size: 0.9rem;
    color: var(--text); outline: none; transition: border-color 0.2s;
    appearance: none;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .form-row input::placeholder { color: var(--text3); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn-primary {
    width: 100%; padding: 13px; background: var(--accent);
    color: #fff; border: none; border-radius: 10px; font-family: var(--font-head);
    font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;
    margin-top: 8px; letter-spacing: 0.3px;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.35); }
  .auth-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text2); }
  .auth-link a { color: var(--accent3); text-decoration: none; font-weight: 500; }
  .auth-link a:hover { text-decoration: underline; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text3); font-size: 0.8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ATTENDANCE CARD */
  .attendance-big { font-family: var(--font-head); font-size: 4rem; font-weight: 800; line-height: 1; }
  .progress-ring-wrap { display: flex; align-items: center; gap: 28px; }
  .ring-container { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; color: var(--text);
  }
  .status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.78rem; font-weight: 600; margin-top: 8px;
  }
  .status-safe { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .status-warn { background: rgba(245,158,11,0.15); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
  .status-crit { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

  /* SUBJECT LIST */
  .subject-row {
    display: grid; grid-template-columns: 1fr auto auto auto auto;
    gap: 12px; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: 0.88rem;
  }
  .subject-row:last-child { border-bottom: none; }
  .subject-name { font-weight: 500; color: var(--text); }
  .mark-cell { text-align: center; color: var(--text2); font-size: 0.83rem; }
  .mark-head { font-size: 0.75rem; color: var(--text3); font-weight: 600; letter-spacing: 0.5px; }

  /* MID MARKS */
  .mid-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .mid-row:last-child { border-bottom: none; }
  .mid-subject { font-weight: 500; font-size: 0.88rem; margin-bottom: 8px; }
  .mid-bars { display: flex; gap: 12px; }
  .mid-bar-wrap { flex: 1; }
  .mid-bar-label { font-size: 0.75rem; color: var(--text3); margin-bottom: 4px; }
  .mid-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .mid-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .bar-good { background: var(--green); }
  .bar-warn { background: var(--gold); }
  .bar-bad { background: var(--red); }
  .need-imp { font-size: 0.72rem; color: var(--red); margin-top: 4px; }

  /* CALENDAR */
  .cal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .month-card { background: var(--bg2); border-radius: 10px; padding: 12px; }
  .month-name { font-size: 0.75rem; font-weight: 700; color: var(--accent3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .day-cell {
    font-size: 0.65rem; height: 20px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: var(--text2); cursor: default;
  }
  .day-cell.exam { background: rgba(239,68,68,0.25); color: var(--red); font-weight: 700; }
  .day-cell.holiday { background: rgba(16,185,129,0.2); color: var(--green); font-weight: 700; }
  .day-cell.fee { background: rgba(245,158,11,0.2); color: var(--gold); font-weight: 700; }
  .day-cell.today { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text2); }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* FEE */
  .fee-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .fee-row:last-child { border-bottom: none; }
  .fee-label { font-size: 0.85rem; color: var(--text2); }
  .fee-val { font-weight: 600; font-size: 0.9rem; }
  .fee-bar-track { height: 8px; background: var(--border); border-radius: 4px; margin: 16px 0; overflow: hidden; }
  .fee-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--accent3)); border-radius: 4px; }

  /* TEACHER */
  .teacher-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
    transition: border-color 0.2s;
  }
  .teacher-card:hover { border-color: var(--accent); }
  .teacher-avatar {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 10px;
    background: linear-gradient(135deg, #1e3a5f, var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: #fff;
  }
  .teacher-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; }
  .teacher-sub { font-size: 0.75rem; color: var(--accent3); margin-bottom: 2px; }
  .teacher-dept { font-size: 0.72rem; color: var(--text3); margin-bottom: 8px; }
  .teacher-email { font-size: 0.72rem; color: var(--text2); }

  /* CHART */
  .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin: 16px 0; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart-bar {
    width: 100%; border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--accent3), var(--accent));
    transition: height 0.8s ease;
  }
  .chart-bar-label { font-size: 0.68rem; color: var(--text3); }
  .chart-bar-val { font-size: 0.7rem; color: var(--text2); font-weight: 600; }

  /* TIMETABLE */
  .tt-table-wrap { overflow-x: auto; }
  .tt-table { width: 100%; border-collapse: collapse; min-width: 700px; }
  .tt-table th {
    padding: 10px 12px; background: var(--bg2); color: var(--text2);
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.3px; text-align: center;
    border: 1px solid var(--border);
  }
  .tt-table td {
    padding: 10px 12px; border: 1px solid var(--border); text-align: center;
    font-size: 0.82rem; vertical-align: middle;
  }
  .tt-day { font-weight: 700; color: var(--accent3); background: var(--bg2); width: 90px; }
  .tt-cell { background: var(--card2); }
  .tt-cell .sub { font-weight: 500; color: var(--text); }
  .tt-cell .prof { font-size: 0.72rem; color: var(--text2); }
  .tt-cell .room { font-size: 0.7rem; color: var(--text3); }
  .tt-lab { background: rgba(37,99,235,0.1); }
  .tt-break { background: rgba(245,158,11,0.08); color: var(--text3); font-size: 0.78rem; }

  /* RESULTS */
  .results-filter { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  .results-filter select {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-family: var(--font-body); font-size: 0.88rem;
    outline: none; cursor: pointer;
  }
  .results-table { width: 100%; border-collapse: collapse; }
  .results-table th {
    padding: 10px 14px; background: var(--bg2); color: var(--text2);
    font-size: 0.78rem; font-weight: 600; text-align: left; border-bottom: 1px solid var(--border);
  }
  .results-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .results-table tr:hover td { background: var(--card2); }
  .grade-badge {
    padding: 2px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700;
    display: inline-block;
  }
  .grade-A { background: rgba(16,185,129,0.15); color: var(--green); }
  .grade-B { background: rgba(96,165,250,0.15); color: var(--accent3); }
  .grade-C { background: rgba(245,158,11,0.15); color: var(--gold); }
  .grade-F { background: rgba(239,68,68,0.15); color: var(--red); }

  /* NOTIFICATIONS */
  .notif-item {
    display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border);
    transition: background 0.15s; cursor: pointer;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
  .notif-dot.read { background: var(--text3); }
  .notif-content { flex: 1; }
  .notif-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; }
  .notif-msg { font-size: 0.82rem; color: var(--text2); margin-bottom: 5px; }
  .notif-date { font-size: 0.72rem; color: var(--text3); }
  .notif-badge {
    padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 600;
    align-self: flex-start; white-space: nowrap;
  }
  .notif-badge.unread { background: rgba(37,99,235,0.2); color: var(--accent3); }
  .notif-badge.read-b { background: var(--border); color: var(--text3); }
  .btn-secondary {
    background: transparent; border: 1px solid var(--accent); color: var(--accent3);
    padding: 8px 18px; border-radius: 8px; font-family: var(--font-body); font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-secondary:hover { background: rgba(37,99,235,0.1); }

  /* FOOTER */
  footer {
    text-align: center; padding: 24px; color: var(--text3); font-size: 0.8rem;
    border-top: 1px solid var(--border); margin-top: 40px;
  }

  /* ERROR/SUCCESS */
  .form-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
  .form-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--green); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .col-span-2, .col-span-3 { grid-column: span 1; }
    main { padding: 20px; }
    header { padding: 0 16px; }
    .nav-tabs { padding: 0 16px; overflow-x: auto; }
    .cal-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .progress-ring-wrap { flex-direction: column; }
    .cal-grid { grid-template-columns: repeat(2, 1fr); }
    .logo span.full { display: none; }
  }

  /* ANIMATIONS */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .animate { animation: fadeUp 0.4s ease both; }
  .animate-d1 { animation-delay: 0.05s; }
  .animate-d2 { animation-delay: 0.1s; }
  .animate-d3 { animation-delay: 0.15s; }
  .animate-d4 { animation-delay: 0.2s; }
  .animate-d5 { animation-delay: 0.25s; }
</style>
</head>

function getInitials(name) { return name.split(" ").map(n => n[0]).join("").toUpperCase().slice(0,2); }

function getGradeClass(g) { return {A:"grade-A",B:"grade-B",C:"grade-C",F:"grade-F"}[g]||"grade-B"; }
function getBarClass(v, max=25) {
  const p = v/max*100;
  return p >= 70 ? "bar-good" : p >= 50 ? "bar-warn" : "bar-bad";
}

// ============================================================
// MINI CALENDAR
// ============================================================
function buildMiniCalendar() {
  const months = ["Nov 2024","Dec 2024","Jan 2025","Feb 2025","Mar 2025","Apr 2025","May 2025","Jun 2025"];
  const examDays = { "Dec 2024": [10,11,12,13,14], "May 2025": [5,6,7,8,9,10] };
  const holidays = { "Nov 2024": [2], "Dec 2024": [25], "Jan 2025": [1,14,26], "Apr 2025": [14] };
  const feeDays = { "Dec 2024": [15], "Mar 2025": [15] };
  const todayDay = 28; const todayMonth = "Nov 2024";

  return `<div class="cal-grid">
    ${months.map(m => {
      const [mn, yr] = m.split(" ");
      const monthNames = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
      const firstDay = new Date(yr, monthNames[mn]-1, 1).getDay();
      const daysInMonth = new Date(yr, monthNames[mn], 0).getDate();
      const exams = examDays[m]||[];
      const hols = holidays[m]||[];
      const fees = feeDays[m]||[];
      let cells = "";
      ["S","M","T","W","T","F","S"].forEach(d=>{ cells+=`<div style="font-size:0.6rem;color:var(--text3);text-align:center;">${d}</div>`; });
      for(let i=0;i<firstDay;i++) cells+=`<div></div>`;
      for(let d=1;d<=daysInMonth;d++) {
        let cls = "day-cell";
        if(exams.includes(d)) cls+=" exam";
        else if(fees.includes(d)) cls+=" fee";
        else if(hols.includes(d)) cls+=" holiday";
        else if(m===todayMonth && d===todayDay) cls+=" today";
        cells+=`<div class="${cls}">${d}</div>`;
      }
      return `<div class="month-card">
        <div class="month-name">${m}</div>
        <div class="day-grid">${cells}</div>
      </div>`;
    }).join("")}
  </div>`;
}

// TIMETABLE
// ============================================================
function buildTimetable() {
  const periods = ["Period 1","Period 2","Break","Period 3","Period 4","Period 5","Period 6"];
  return `
    <div class="page-header animate">
      <div class="page-title">Weekly Timetable</div>
      <div class="page-subtitle">Semester 5 • CSE • Academic Year 2024-25</div>
    </div>
    <div class="card animate animate-d1">
      <div class="card-title"><span class="icon">📅</span>Class Schedule</div>
      <div class="tt-table-wrap">
        <table class="tt-table">
          <thead>
            <tr>
              <th>Day</th>
              ${periods.map(p=>`<th>${p}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${MOCK_TIMETABLE.map(row=>`<tr>
              <td class="tt-day">${row.day}</td>
              ${row.periods.map((p,i)=>{
                if(!p) return `<td class="tt-cell" style="color:var(--text3);font-size:0.75rem;">—</td>`;
                if(p==="Break") return `<td class="tt-break">☕ Break</td>`;
                const [sub,prof,room] = p.split("\n");
                const isLab = room && room.toLowerCase().includes("lab");
                return `<td class="tt-cell ${isLab?"tt-lab":""}">
                  <div class="sub">${sub}</div>
                  <div class="prof">${prof}</div>
                  <div class="room">${room}</div>
                </td>`;
              }).join("")}
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div style="margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text2);">
          <div style="width:12px;height:12px;background:rgba(37,99,235,0.1);border-radius:3px;border:1px solid rgba(37,99,235,0.3)"></div>Lab Session
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text2);">
          <div style="width:12px;height:12px;background:rgba(245,158,11,0.08);border-radius:3px;border:1px solid rgba(245,158,11,0.2)"></div>Break
        </div>
      </div>
    </div>`;
}

// ============================================================
// RESULTS
// ============================================================
function buildResults() {
  const sems = [...new Set(MOCK_RESULTS.map(r=>r.sem))];
  const sel = state.resultFilter || "All";
  const filtered = sel === "All" ? MOCK_RESULTS : MOCK_RESULTS.filter(r=>r.sem===sel);

  return `
    <div class="page-header animate">
      <div class="page-title">Academic Results</div>
      <div class="page-subtitle">Complete academic record • Roll: ${state.user.roll}</div>
    </div>
    <div class="card animate animate-d1">
      <div class="card-title"><span class="icon">📊</span>Results</div>
      <div class="results-filter">
        <label style="font-size:0.83rem;color:var(--text2);">Filter by Semester:</label>
        <select onchange="filterResults(this.value)">
          <option value="All" ${sel==="All"?"selected":""}>All Semesters</option>
          ${sems.map(s=>`<option value="${s}" ${sel===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <span style="font-size:0.8rem;color:var(--text3);margin-left:auto;">${filtered.length} subjects</span>
      </div>
      <div style="overflow-x:auto;">
        <table class="results-table">
          <thead>
            <tr>
              <th>Semester</th><th>Subject</th>
              <th>Mid-1 (/25)</th><th>Mid-2 (/25)</th>
              <th>End-term (/75)</th><th>Total (/125)</th><th>Grade</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(r=>`<tr>
              <td style="color:var(--text3);font-size:0.8rem;">${r.sem}</td>
              <td style="font-weight:500;">${r.subject}</td>
              <td style="text-align:center;">${r.mid1}</td>
              <td style="text-align:center;">${r.mid2}</td>
              <td style="text-align:center;">${r.end}</td>
              <td style="text-align:center;font-weight:600;">${r.total}</td>
              <td style="text-align:center;"><span class="grade-badge ${getGradeClass(r.grade)}">${r.grade}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function buildNotifications() {
  const unread = state.notifications.filter(n=>!n.isRead).length;
  return `
    <div class="page-header animate">
      <div class="page-title">Notifications</div>
      <div class="page-subtitle">${unread} unread notification${unread!==1?"s":""}</div>
    </div>
    <div class="card animate animate-d1">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div class="card-title" style="margin-bottom:0;"><span class="icon">🔔</span>All Notifications</div>
        ${unread>0?`<button class="btn-secondary" onclick="markAllRead()">Mark all as read</button>`:""}
      </div>
      ${state.notifications.map(n=>`
        <div class="notif-item" onclick="markRead(${n.id})">
          <div class="notif-dot ${n.isRead?"read":""}"></div>
          <div class="notif-content">
            <div class="notif-title" style="color:${n.isRead?"var(--text2)":"var(--text)"}">${n.title}</div>
            <div class="notif-msg">${n.message}</div>
            <div class="notif-date">${n.date}</div>
          </div>
          <span class="notif-badge ${n.isRead?"read-b":"unread"}">${n.isRead?"Read":"Unread"}</span>
        </div>`).join("")}
    </div>`;
}

// ============================================================
// EVENT HANDLERS
// ============================================================
function goTo(page) {
  state.page = page; state.error = ""; state.success = "";
  render();
}

function handleRegister() {
  const name=v("reg-name"), roll=v("reg-roll"), branch=v("reg-branch"),
        sem=v("reg-sem"), email=v("reg-email"), pass=v("reg-pass"), cpass=v("reg-cpass");
  if (!name||!roll||!branch||!sem||!email||!pass) { setError("All fields are required."); return; }
  if (pass!==cpass) { setError("Passwords do not match."); return; }
  if (pass.length<6) { setError("Password must be at least 6 characters."); return; }
  // Simulate API call
  state.success="Registration successful! Redirecting to login...";
  state.error="";
  render();
  setTimeout(()=>{ state.page="login"; state.success="Registration successful! Please login."; render(); }, 1500);
}

function handleLogin() {
  const roll=v("login-roll"), pass=v("login-pass");
  if (!roll||!pass) { setError("Please enter roll number and password."); return; }
  // Simulate auth
  if (pass.length<3) { setError("Invalid credentials. Please try again."); return; }
  loginSuccess({ ...MOCK_USER, roll: roll });
}

function demoLogin() {
  loginSuccess(MOCK_USER);
}

function loginSuccess(user) {
  state.user = user; state.page = "home"; state.homeTab = "dashboard";
  state.error = ""; state.success = "";
  render();
}

function handleLogout() {
  state.user = null; state.page = "login"; state.error = ""; state.success = "";
  render();
}

function setTab(tab) { state.homeTab = tab; render(); }

function filterResults(val) { state.resultFilter = val; render(); }

function markRead(id) {
  const n = state.notifications.find(n=>n.id===id);
  if (n) n.isRead = true;
  render();
}

function markAllRead() {
  state.notifications.forEach(n=>n.isRead=true);
  render();
}

function setError(msg) { state.error = msg; state.success = ""; render(); }

function v(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
